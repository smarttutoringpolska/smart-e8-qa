name: Błąd kursu Smart E8
description: Odtwarzalny problem znaleziony w środowisku QA
title: "[BUG] "
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wersja źródłowa, profil i viewport
      placeholder: "sourceCommit · weak30 · 1366×768"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Dokładne miejsce i kroki odtworzenia
      description: "Wskaż dział, serię, pytanie oraz wybrane odpowiedzi. Wyłącznie dane fikcyjne."
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Wynik obecny i dowód
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Wynik oczekiwany i propozycja poprawki
    validations:
      required: true
